<body>
<div id="app">
  <div id="top"><div id="order"></div><button id="sndBtn" aria-label="Sound">♪</button><button id="menuBtn" aria-label="Menu">☰</button></div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div><div id="info"></div><div id="banner"></div><div id="toast"></div></div>
  <div id="hud"><div id="who"></div><div id="abil"></div></div>
</div>
<div id="scene" class="hidden"></div>
<div id="overlay" class="hidden"><div id="bigp" class="hidden"><img alt=""><div class="nm"></div></div><div id="panel"></div></div>
<div id="dice" class="hidden"></div>
<div id="flash"></div>
<script>
'use strict';
(() => {
const COLS = 12, ROWS = 9;
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let TS = 48, DPR = 1, ROT = false, VC = COLS, VR = ROWS;
let SPEED = 1, DICE = 1;               // global animation speed / dice speed multipliers
const forced = [];                       // test hook: forced d20 results
const rnd = n => (n === 20 && forced.length) ? forced.shift() : 1 + Math.floor(Math.random() * n);
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = 'emberfall-save-v1';
function parseDice(s) { const m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(s); return { n: +m[1], s: +m[2], b: m[3] ? +m[3] : 0 }; }
function withBonus(s, n) { if (!n) return s; const d = parseDice(s); const b = d.b + n; return `${d.n}d${d.s}${b ? (b > 0 ? '+' + b : b) : ''}`; }
function rollExpr(s, crit) {
  const d = parseDice(s), n = d.n * (crit ? 2 : 1), rolls = [];
  for (let i = 0; i < n; i++) rolls.push(rnd(d.s));
  return { expr: crit ? `${n}d${d.s}${d.b ? (d.b > 0 ? '+' + d.b : d.b) : ''}` : s, rolls, bonus: d.b, total: rolls.reduce((a, c) => a + c, 0) + d.b };
}
function fmtRoll(r) { return `${r.expr} → ${r.rolls.map(v => `<span class="pd">${v}</span>`).join('')}${r.bonus ? ` ${r.bonus > 0 ? '+' : '−'} ${Math.abs(r.bonus)}` : ''} = <b>${r.total}</b>`; }
const sgn = n => (n >= 0 ? '+' : '−') + Math.abs(n);

// ---------------- DATA ----------------
const HEROES = {
  brannoc: { name: 'Brannoc', cls: 'Oathsworn Fighter', color: '#a8332a', glyph: 'sword', hp: 24, hpLv: 8, ac: 17, spd: 5, atk: 5, init: 1, save: 2,
    abil: ['strike', 'cleave', 'secondwind'], skills: { Intimidation: 4, Athletics: 5, Persuasion: 0, Insight: 1, Stealth: 1, Arcana: 0, Investigation: 0 } },
  wren: { name: 'Wren', cls: 'Shadow Rogue', color: '#2e7d5b', glyph: 'bow', hp: 18, hpLv: 6, ac: 14, spd: 6, atk: 5, init: 4, save: 4,
    abil: ['bow', 'dagger', 'hide', 'dash'], skills: { Stealth: 6, Investigation: 3, Persuasion: 2, Insight: 2, Intimidation: 1, Arcana: 0, Athletics: 1 } },
  isolde: { name: 'Isolde', cls: 'Ember Wizard', color: '#3949ab', glyph: 'star', hp: 14, hpLv: 5, ac: 12, spd: 5, atk: 5, init: 2, save: 2,
    abil: ['firebolt', 'burst', 'darts', 'blink'], skills: { Arcana: 5, Investigation: 5, Insight: 1, Persuasion: 0, Intimidation: 0, Stealth: 2, Athletics: -1 } },
  maren: { name: 'Maren', cls: 'Dawn Cleric', color: '#b8901c', glyph: 'sun', hp: 20, hpLv: 6, ac: 16, spd: 5, atk: 4, init: 0, save: 1,

   <button class="choice" data-a="back" style="margin-top:10px">Back</button>`, true, { back });
}
function openMenu() {

  panel(`<h2>Menu</h2>
    <button class="choice" data-a="resume">Resume</button>
    <button class="choice" data-a="snd">Sound: ${muted ? 'Off' : 'On'}</button>
    <button class="choice" data-a="dice">Dice speed: ${DICE < 1 ? 'Fast' : 'Normal'}</button>
    <button class="choice" data-a="help">How to Play</button>
    ${C ? '<button class="choice" data-a="retry">Restart this fight</button>' : ''}
    <button class="choice" data-a="quit">Save &amp; quit to title</button>`, true,
    { resume: closeMenu, snd: () => { setMuted(!muted); menuOpen = false; openMenu(); }, dice: () => { DICE = DICE < 1 ? 1 : 0.5; localStorage.setItem('emberfall-fastdice', DICE < 1 ? '1' : '0'); menuOpen = false; openMenu(); },
      help: () => helpScreen(() => { menuOpen = false; openMenu(); }), retry: () => { menuOpen = false; hideOverlay(); C = null; G = loadSave(); runStage(); }, quit: () => { menuOpen = false; C = null; titleScreen(); } });
}
let menuRestore = null;
function closeMenu() { menuOpen = false; if (C) hideOverlay(); else if (G) runStage(); else titleScreen(); }
$('#menuBtn').addEventListener('click', () => { initAudio(); openMenu(); });
$('#sndBtn').addEventListener('click', () => { initAudio(); setMuted(!muted); });

// ---------------- INPUT ----------------
function setInputMode(m) { if (inputMode === m) return; inputMode = m; document.body.classList.toggle('kb', m === 'pad' || m === 'key'); updateHud(); updateInfo(); }
function evTile(e) { const r = cv.getBoundingClientRect(); const vx = Math.floor((e.clientX - r.left) / r.width * VC), vy = Math.floor((e.clientY - r.top) / r.height * VR); if (vx < 0 || vy < 0 || vx >= VC || vy >= VR) return null; return viewToGrid(vx, vy); }
cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || !C) return; setInputMode('mouse'); const t = evTile(e); if (t && (t.x !== C.cursor.x || t.y !== C.cursor.y)) { C.cursor = t; updateInfo(); } });
cv.addEventListener('pointerdown', e => { initAudio(); e.preventDefault(); if (!C) return; const t = evTile(e); if (!t) return; setInputMode(e.pointerType === 'touch' ? 'touch' : 'mouse'); C.cursor = t; updateInfo(); handleTile(t.x, t.y, e.pointerType === 'touch'); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
function moveCursor(dx, dy) { const v = gridToView(C.cursor.x, C.cursor.y); const nv = { x: clamp(v.x + dx, 0, VC - 1), y: clamp(v.y + dy, 0, VR - 1) }; C.cursor = viewToGrid(nv.x, nv.y); C.pending = null; updateInfo(); }
function cycleAb(d) { if (!isPlayerTurn()) return; const l = heroAbils(C.cur); C.sel = (C.sel + d + l.length) % l.length; sfx('select'); updateUI(); }
function nextTarget(d) {
  if (!C || !C.cur) return; const a = isPlayerTurn() ? AB[curAbKey()] : null; const wantAlly = a && a.target === 'ally';
  const list = C.units.filter(u => (wantAlly ? u.team === 'hero' : u.team === 'foe' && u.hp > 0)).sort((p, q) => cheb(C.cur, p) - cheb(C.cur, q));
  if (!list.length) return; let i = list.findIndex(u => u.x === C.cursor.x && u.y === C.cursor.y); i = (i + d + list.length) % list.length; C.cursor = { x: list[i].x, y: list[i].y }; updateInfo();
}
function confirmAction() { if (!isPlayerTurn()) return; const key = curAbKey(); if (AB[key].target === 'self') return pressAbility(C.sel); handleTile(C.cursor.x, C.cursor.y, false); }
function cancelAction() { if (!isPlayerTurn()) return; C.sel = firstUsable(C.cur); C.cursor = { x: C.cur.x, y: C.cur.y }; C.pending = null; updateUI(); }
addEventListener('keydown', e => {

    if (['arrowup', 'arrowleft', 'w', 'a'].includes(kl)) { e.preventDefault(); setFocus(focusI - 1); }
    else if (['arrowdown', 'arrowright', 's', 'd'].includes(kl)) { e.preventDefault(); setFocus(focusI + 1); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (!diceShowing) clickFocused(); }
    else if (/^[1-9]$/.test(k)) { if (finishTyping()) return; const f = focusables(); const b = f[+k - 1]; if (b && !diceShowing) b.click(); }

    return;
  }
  if (k === 'Escape') { e.preventDefault(); if (isPlayerTurn() && (C.sel !== firstUsable(C.cur) || C.pending)) cancelAction(); else openMenu(); return; }
  if (!C) return;
  const dirs = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  if (dirs[kl]) { e.preventDefault(); setInputMode('key'); moveCursor(...dirs[kl]); return; }

  else if (kl === 'f') endTurn();
  else if (k === 'Tab') { e.preventDefault(); setInputMode('key'); nextTarget(e.shiftKey ? -1 : 1); }

});
const prevB = []; let stickDir = null, stickT = 0;

  const pr = i => !!(g.buttons[i] && g.buttons[i].pressed), edge = i => pr(i) && !prevB[i];
  let dx = 0, dy = 0; const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
  if (ax < -0.5) dx = -1; if (ax > 0.5) dx = 1; if (ay < -0.5) dy = -1; if (ay > 0.5) dy = 1;
  if (pr(14)) dx = -1; if (pr(15)) dx = 1; if (pr(12)) dy = -1; if (pr(13)) dy = 1;
  const dir = dx || dy ? dx + ',' + dy : null; let any = !!dir; for (let i = 0; i < g.buttons.length; i++) if (pr(i)) any = true;
  if (any) { setInputMode('pad'); initAudio(); }
  let step = false; if (dir) { if (dir !== stickDir) { step = true; stickT = now + 260; } else if (now >= stickT) { step = true; stickT = now + 130; } } stickDir = dir;
  if (overlayOpen()) {
    if (step) setFocus(focusI + (dy || dx)); if (edge(0) && !diceShowing) clickFocused(); if ((edge(1) || edge(9)) && menuOpen) closeMenu(); else if (edge(9) && C) openMenu();
  } else if (C) {
    if (step) moveCursor(dx, dy); if (edge(0)) confirmAction(); if (edge(1)) cancelAction(); if (edge(4)) cycleAb(-1); if (edge(5)) cycleAb(1);
    if (edge(3)) endTurn(); if (edge(7)) nextTarget(1); if (edge(6) && C.cur) { C.cursor = { x: C.cur.x, y: C.cur.y }; updateInfo(); } if (edge(9)) openMenu();
  }

addEventListener('gamepadconnected', () => { setInputMode('pad'); toast('Controller connected'); });

// ---------------- LAYOUT ----------------
function resize() {
  const st = $('#stage').getBoundingClientRect(); if (!st.width || !st.height) return;
  ROT = st.height > st.width * 1.15; VC = ROT ? ROWS : COLS; VR = ROT ? COLS : ROWS;

// ---------------- BOOT ----------------
DICE = localStorage.getItem('emberfall-fastdice') === '1' ? 0.5 : 1;

for (const n of Object.values(MAP_ART)) art('map_' + n); for (const k of TOK_KEYS) art('t_' + k); art('t_ilsa_npc');

  state() { return { stage: G && G.stage, combat: !!C, over: C && C.over, overlay: overlayOpen(), dice: diceShowing, cur: C && C.cur && C.cur.name, round: C && C.round, rot: ROT, ts: TS,
