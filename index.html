<style>

<body>
<div id="app">
  <div id="top"><div id="order"></div><button id="sndBtn" aria-label="Sound">♪</button><button id="menuBtn" aria-label="Menu">☰</button></div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div><div id="info"></div><div id="banner"></div><div id="toast"></div></div>
  <div id="hud"><div id="who"></div><div id="abil"></div></div>
</div>
<div id="scene" class="hidden"></div>
<div id="overlay" class="hidden"><div id="bigp" class="hidden"><img alt=""><div class="nm"></div></div><div id="panel"></div></div>
<div id="dice" class="hidden"></div>
<div id="flash"></div>
<script>
'use strict';
(() => {
const COLS = 12, ROWS = 9;
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let TS = 48, DPR = 1, ROT = false, VC = COLS, VR = ROWS;
let SPEED = 1, DICE = 1;               // global animation speed / dice speed multipliers
const forced = [];                       // test hook: forced d20 results
const rnd = n => (n === 20 && forced.length) ? forced.shift() : 1 + Math.floor(Math.random() * n);
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = 'emberfall-save-v1';
function parseDice(s) { const m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(s); return { n: +m[1], s: +m[2], b: m[3] ? +m[3] : 0 }; }
function withBonus(s, n) { if (!n) return s; const d = parseDice(s); const b = d.b + n; return `${d.n}d${d.s}${b ? (b > 0 ? '+' + b : b) : ''}`; }
function rollExpr(s, crit) {
  const d = parseDice(s), n = d.n * (crit ? 2 : 1), rolls = [];
  for (let i = 0; i < n; i++) rolls.push(rnd(d.s));
  return { expr: crit ? `${n}d${d.s}${d.b ? (d.b > 0 ? '+' + d.b : d.b) : ''}` : s, rolls, bonus: d.b, total: rolls.reduce((a, c) => a + c, 0) + d.b };
}
function fmtRoll(r) { return `${r.expr} → ${r.rolls.map(v => `<span class="pd">${v}</span>`).join('')}${r.bonus ? ` ${r.bonus > 0 ? '+' : '−'} ${Math.abs(r.bonus)}` : ''} = <b>${r.total}</b>`; }
const isPC = u => u.team === 'hero' && !u.npc;
const vk = u => (u.T && u.T.voKey) || u.id;
const sgn = n => (n >= 0 ? '+' : '−') + Math.abs(n);

// ---------------- DATA ----------------
const HEROES = {
  brannoc: { name: 'Brannoc', cls: 'Oathsworn Fighter', color: '#a8332a', glyph: 'sword', hp: 24, hpLv: 8, ac: 17, spd: 5, atk: 5, init: 1, save: 2,
    abil: ['strike', 'cleave', 'secondwind'], skills: { Intimidation: 4, Athletics: 5, Persuasion: 0, Insight: 1, Stealth: 1, Arcana: 0, Investigation: 0 } },
  wren: { name: 'Wren', cls: 'Shadow Rogue', color: '#2e7d5b', glyph: 'bow', hp: 18, hpLv: 6, ac: 14, spd: 6, atk: 5, init: 4, save: 4,

hat wasn't 'hit it'?",2.78],"banter.0b":["brannoc","Once. I hit it anyway.",1.51],"banter.1a":["isolde","Statistically, one of us dies in this fight.",3.07],"banter.1b":["maren","Then statistically, stop talking and help.",2.88],"banter.2a":["brannoc","Maren, if I fall, tell them I was handsome.",2.64],"banter.2b":["maren","I'll tell them you were brave. I don't lie in church.",3.1],"banter.3a":["maren","Wren, is that my coin purse on your belt?",2.66],"banter.3b":["wren","It's a loan. A long, very quiet loan.",2.52],"banter.4a":["isolde","Wren, do try not to stab anything I'm about to set on fire.",4.1],"banter.4b":["wren","Then set things on fire slower, your highness.",2.69],"banter.5a":["brannoc","Isolde, can you make my sword be on fire?",2.64],"banter.5b":["isolde","I can make YOU be on fire. Ask me again.",2.9],"d_108nh1n":["king","Rise, my hollow servants! As I was SAYING, before I was so rudely—",5.59],"d_1vgjhpu":["narr","The crypt door bursts off its hinges. Something enormous is wearing a very small hat.",6.55],"d_ga8ys2":["grath","GRATH IS HERE! Grath brought his maul. Grath did not bring the toll. Today is free!",8.81],"d_1x4nfwn":["ilsa","Don't look at me like that. I'm not here for you. I'm here because he never paid me.",5.88],"d_1abqel3":["narr","A crow flaps down from the dark and drops a letter in the King's lap. He opens it, because even undead tyrants cannot resist mail.",9.79],"d_1aqmd6u":["king","\"Dear Hollow King. The adventurers left me chained to a gate. Also, the cult owes me four months' wages. Warm regards, Ilsa.\"",9.12],"d_sul165":["king","…WARM REGARDS?",2.14],"d_x2pxop":["narr","The King is so offended he loses his next turn.",3.26],"d_1p1ncf":["narr","The King's crown blazes. The sigils in your palms catch like fish-hooks. He is pulling his crown back together, through you.",9.67],"d_7p69q4":["king","MINE! Every shard, every hand, every last drop of you, MINE!",4.92],"d_14qm74k":["narr","Your hands are on fire. You have about one breath to do something clever.",5.88],"d_12wv4cu":["king","Don't… call me… that…",2.5],"d_ce5cvw":["isolde","Thank you for the notes, Magister. You were useful exactly once.",3.91],"d_j9cl5d":["isolde","It's slipping — it's not enough!",2.21],"d_1u90nze":["narr","Four palms flare silver at once. The pull reverses. Now the crown is bleeding into you, and the King is the one screaming.",10.1],"d_1vishvf":["maren","Hands together. Look at me, not him. We hold.",3.05],"d_117wljh":["maren","Hold— hold on—!",1.42],"d_1f4s4ik":["brannoc","Finally, a plan I understand!",1.9],"d_193k8um":["brannoc","I ran once. Not this time.",1.87],"d_1efaj8j":["narr","The caravan to Thornwick is burning. A moment ago, the black iron crown you were paid to guard split open with a scream. Now you are waking up in a ditch, an ember-sigil seared into your palm, three strangers groaning beside you. You feel… employed. Briefly.",20.42],"d_7gsk3g":["narr","Somewhere, a horse is making the noise horses make when they have decided to quit. You can relate.",7.34],"d_2z9a1y":["brannoc","On your feet! Whatever that crown did to us can wait. We have company.",4.32],"d_2dngdt":["wren","Gloomkin raiders. Three of them, and a chief with a very ugly hat. They haven't spotted us behind the wagon yet.",6.79],"d_1ugp3ph":["skarn","OI! Crown-thieves! That shiny crown is Skarn's now. Skarn will wear it on Skarn's head, next to Skarn's OTHER hat!",7.18],"d_17emqg8":["wren","He has two hats. On one head. I respect it and I hate it.",3.79],"d_vof9vm":["isolde","These marks… they're warm. Like something is listening through them.",3.53],"d_2tck4q":["brannoc","Introductions! Quickly. Brannoc. Oathsworn. I hit things for good causes.",4.68],"d_w1bynh":["wren","Wren. I take things for bad causes. Mostly mine.",3.48],"d_1087yak":["isolde","Isolde. Collegium of Embers. Formerly. There was a small fire.",4.08],"d_1q8hxzv":["maren","Maren, of the Dawnmother. Whatever happens next, I forgive you.",4.08],"d_ns6dzw":["wren","We haven't done anything yet.",1.85],"d_ndf4zf":["maren","I know.",0.96],"d_5otkci":["maren","Now. How do we take them?",1.9],"d_i3r8cw":["narr","You slip through the smoke like a rumor. Not one of them sees you coming. Every hero gets advantage on their first attack.",9.38],"d_18k1sc5":["narr","A burning wheel snaps beneath Wren's boot with the volume of a cathedral bell. Every goblin turns. So much for subtle.",9.65],"d_z7r54r":["brannoc","FOR… whatever this is!",1.58],"d_1sjlesu":["narr","Brannoc puts his shoulder to the burning wagon and heaves. It rolls downhill, gathers speed and opinions, and flattens a goblin who had just finished saying \"what's that noise\". One fewer cutter.",14.5],"d_1p83ko7":["narr","The wagon does not move. Brannoc does, slightly, into the mud. The goblins watch this with real interest, then attack.",9.98],"d_1t9u0n6":["narr","Night falls. You make camp in a hollow off the road. The fire crackles, and the sigil on your palm pulses in time with it, like a second heartbeat that does not belong to you.",12.79],"d_18nmued":["isolde","I studied the crown's shards while you three argued over the chief's hat. It belonged to the Hollow King, a tyrant who refused to die. Our marks are pieces of his crown. He wants them back.",10.94],"d_fr1sfa":["wren","And by \"back\" you mean…",1.56],"d_ti7jnq":["isolde","Out of our hands. Possibly with the hands still attached.",3.5],"d_135b74a":["maren","Who hired the caravan? Someone knew what was in that box.",3.53],"d_9ir1ys":["isolde","The contract was sealed by the Collegium. That's all I know. That's… all I'd like to know, actually.",5.54],"d_1egedr9":["narr","Brannoc is sharpening his sword with the tenderness most people reserve for small animals.",5.78],"d_1q6nmy7":["wren","Does it have a name? It has a name. Look at his face. It has a name.",3.74],"d_yha1k":["brannoc","Margaret.",1.01],"d_1njqjgp":["wren","Your sword is called Margaret.",1.9],"d_1fftyai":["brannoc","It was my mother's name. She also hit things for good causes.",3.94],"d_vxqk1s":["brannoc","I should tell you something, since we might die. At Greywater, twelve years ago, the line broke. I ran. Everyone who stayed is still there.",9.1],"d_fs1g3d":["brannoc","I took the oath after. Swore I'd never run again. Some nights I'm not sure the oath took.",5.64],"d_1a8sxxj":["brannoc","So. Now you know what you're following.",1.92],"d_1xf35ds":["brannoc","Then hear it, all of you. I will not run. Not from goblins, not from kings, not from Maren when she's angry.",6.98],"d_p48lov":["maren","That last one is unwise.",1.78],"d_2suwdt":["narr","Brannoc's Oath: Brannoc gets one more use of Second Wind.",4.3],"d_hzydw8":["brannoc","That is the most practical comfort anyone has ever given me. I hate how well it works.",5.76],"d_1ma3nke":["narr","Iron Hide: Brannoc's armor class rises by one.",4.03],"d_p102gg":["brannoc","The marks pull north: through the Sallow Mire, past Grath's Bridge, to Thornwick and the old chapel beyond. Before we sleep?",7.99],"d_14dwoua":["narr","Beneath a scorched tarp you find two Potions of Healing, still corked, and a goblin's diary. The diary is mostly drawings of hats. (+2 Potions)",9.72],"d_ng0hy5":["narr","You find ash, a broken lute, and one very sad boot. You feel the boot's loneliness deeply.",7.75],"d_1fv196j":["maren","\"Dawnmother, keep these fools alive. Mostly Brannoc — he needs it most.\" (Everyone is Blessed, +2 to hit, for the next fight.)",4.75],"d_17ga3a":["wren","So. Cursed crown, undead king, mystery brands. Anyone else regret taking the escort job?",6.07],"d_gvsht7":["brannoc","The pay was good!",1.22],"d_1epu8aw":["wren","The pay was a sandwich, Brannoc.",2.04],"d_ljnf5i":["maren","It was a good sandwich.",1.68],"d_1s7iwby":["narr","Long rest. You sleep like the dead, which is ironic, given where you are going. Health and abilities restored.",9.19],"d_1qmcm9s":["narr","By noon the road sinks into the Sallow Mire, a swamp so damp it has opinions about your boots. Lights drift over the water. Wren says don't follow the lights. Brannoc is already following the lights.",15.74],"d_4jqdxi":["narr","At the heart of the mire stands a hut on spindly stilts. On the porch, an old woman knits something long and grey. It is not wool.",10.51],"d_1quaxnd":["grisk","Visitors! Come in, come in, dearies. Mind the toads. They're friendly. They're also hungry. Those aren't opposites.",12.31],"d_kmqwos":["isolde","Is that… hair? Is she knitting with hair?",2.62],"d_11lp4c4":["grisk","Waste not, dearie. Mother Grisk sells what folk keep hidden. Secrets. Names. The odd recipe. And you four are just stuffed with secrets.",13.58],"d_3yy96b":["grisk","Shall I show you? A free sample. Grisk is generous on Tuesdays.",6.29],"d_gcorly":["wren","It's not Tuesday.",1.32],"d_17m7fch":["grisk","It is in here, dearie.",1.82],"d_15c7oaz":["grisk","The big one cries at weddings. Every wedding. He's been to forty. Some of them he wasn't invited to.",8.88],"d_8rc4xl":["brannoc","Love is beautiful and I will not apologize.",3.07],"d_1cyacqz":["grisk","The little thief's real name is Wrenhilda.",2.62],"d_d1clmm":["wren","Say that again and you'll be knitting with your own hair.",2.81],"d_1hb2b1x":["grisk","And the clever one. It wasn't a small fire, was it, dearie? East wing, west wing, the bell tower, and a very surprised goose.",10.18],"d_1p0ljs1":["isolde","The goose was fine. Eventually.",2.47],"d_84i0gc":["grisk","And the priestess. She doesn't forgive any of you. She keeps a list.",5.95],"d_1myarjw":["maren","It's a short list. Brannoc is on it twice.",2.95],"d_1fbv1dw":["brannoc","TWICE?",0.86],"d_g0wwi":["grisk","Now. Business. The thing that's coming for your hands has a name. A true name, from before he was hollow. Say it to his face and he'll remember being small.",12.72],"d_qcfqoi":["grisk","Grisk will trade it. For one memory. Just a little one. You won't even miss it.",7.7],"d_wg11cl":["grisk","Well, dearies? One memory, one name. Fair's fair.",5.88],"d_rfcdn2":["maren","Take the sandwich. The one from the caravan. I'll live.",3.5],"d_1jkx5x9":["narr","Grisk plucks something silver out of the air beside Maren's ear and pops it into a jar. Maren blinks, and looks faintly puzzled, like someone who has walked into a room and forgotten why.",13.2],"d_85frpc":["grisk","Aldric Vane. That was his name, when he was a man, and a short one. Pleasure doing business! Now — supper.",9.65],"d_dwf63v":["narr","Isolde's sigil flares. For half a heartbeat she is inside the hag's mind, which smells like boiled cabbage and spite. She comes out holding a name: Aldric Vane.",12.84],"d_1soxcjp":["grisk","Thief! Grisk was going to be so nice about eating you, and now she won't be.",5.57],"d_2fq5a9":["grisk","Naughty! Nobody reads Grisk without paying. Now Grisk reads YOU. With her teeth.",7.85],"d_1bjn5qx":["brannoc","Margaret says no.",1.39],"d_n5q589":["grisk","Margaret? Oh, the sword. Charming. I'll knit you a sheath. From you.",8.02],"d_yr1hol":["narr","At dawn you reach the river. A troll the size of a hay cart squats on the only bridge, two shadow-hounds snapping at his heels. He has the unmistakable look of a creature who has invented a fee.",13.8],"d_75lcto":["grath","Bridge toll! Forty gold, or I grind yer bones fer bread. …No wait, that's me cousin. Forty gold or a fight.",9.24],"d_73uj9l":["brannoc","Those hounds. That one's a Biscuit. And that one is definitely a Lord Snuffles.",4.99],"d_5g9c3f":["grath","Their names are Gnash and Ruin.",2.09],"d_1k3szf1":["brannoc","Not anymore.",1.15],"d_163mksl":["grath","Well? Grath is hungry and Grath is bad at waiting.",4.49],"d_crgaob":["grath","Pleasure doin' business! Mind the hounds, they bite tourists. And locals. And Grath.",8.74],"d_vx5tpp":["grath","…The Hollow King? Grath hates that guy. Here, take this, and go break his stupid crown.",7.63],"d_1aororz":["grath","If yer still alive later, Grath might come help. Grath likes a big fight. Grath does NOT like that guy.",8.62],"d_20ekbg":["narr","Grath takes one look at Brannoc, yelps like a kettle, and dives into the river, abandoning his hoard. You feel taller. (+25 gold)",9.02],"d_kpzzo9":["narr","Wren holds up Skarn's Other Hat. Grath goes very still. A single tear rolls down a face like a landslide.",9.46],"d_147uuw8":["grath","Is it… for Grath?",1.75],"d_p7lsd6":["wren","It is now.",1.06],"d_la80s0":["grath","Nobody ever gives Grath a hat. Everybody just gives Grath a hard time. You come back if you need a troll. Grath is a good troll to have.",11.54],"d_g2zyji":["grath","Hah! Nice try, little meat. HOUNDS!",5.04],"d_1xuicgd":["brannoc","Steel it is! Biscuit, Lord Snuffles — nothing personal.",3.5],"d_9rktpg":["narr","Thornwick is a town built by people who wanted to be left alone, and then extended by people who wanted a drink. You find both at the Drowned Rat, which has a stuffed rat above the bar wearing a tiny crown. Nobody remembers why. Nobody asks.",18.38],"d_bmwg53":["odo","Welcome to the Drowned Rat! Boots off the tables, swords stay sheathed, and if you're here to fight, take it outside, or pay for the furniture first.",9.19],"d_8o75w9":["wren","Keep your heads down. If a man with a ledger smiles at me, we leave.",3.98],"d_59rly":["narr","A man with a ledger smiles at Wren.",2.69],"d_1wampnk":["pell","Wren! My favorite debtor. Sixty gold, plus interest, plus the interest on the interest, plus my feelings. Call it sixty. I'm sentimental.",7.61],"d_18l1ag4":["wren","Pell. You look exactly as rich as I remember.",2.9],"d_11slbnv":["pell","And you look like you're about to tell me you don't have it. Again. Boys?",3.65],"d_9v3kfr":["narr","Two very large men stand up from a corner table. They do this slowly, the way mountains would, if mountains were paid by the hour.",9.53],"d_1omh7hc":["isolde","Is that a bishop asleep at the bar?",2.64],"d_ilsyor":["wren","Don't look at the bishop.",1.42],"d_bb1md1":["pell","Sixty gold, little bird. Or we do this the Drowned Rat way.",3.41]
